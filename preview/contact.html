<!doctype html>
<html lang="en-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>kgmstudio · Preview</title>
<style>html,body{margin:0;height:100%;background:#0B0D14;color:#9AA0AA;font:14px system-ui,sans-serif;display:grid;place-items:center}</style></head>
<body><p id="m">Opening the preview…</p>
<script>
(async function () {
  var gate = "../index.html#preview";
  var pw = null;
  try { pw = sessionStorage.getItem("kgmPreview"); } catch (e) {}
  function back() { try { sessionStorage.setItem("kgmNext", location.pathname); sessionStorage.removeItem("kgmPreview"); } catch (e) {} location.replace(gate); }
  if (!pw || !window.crypto || !crypto.subtle) return back();
  function b64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
  try {
    var box = await (await fetch("contact.enc", { cache: "no-store" })).json();
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(box.salt), iterations: box.iterations, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(box.iv) }, key, b64(box.data)));
    document.open(); document.write(html); document.close();
  } catch (e) { back(); }
})();
</script></body></html>
